name: Deploy Frontend to GitHub Pages (no Docker)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            Criconnnect/frontend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('Criconnnect/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci
        working-directory: ./Criconnnect/frontend

      - name: Build
        run: npm run build
        working-directory: ./Criconnnect/frontend

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./Criconnnect/frontend/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
